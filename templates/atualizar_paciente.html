{% extends "base.html" %}
{% block title %}Hospital Dra. Yuska - Atualizar Paciente{% endblock %}
{% block content %}

<div class="page-header">
    <span class="eyebrow">Pacientes</span>
    <h1>Atualizar Dados do Paciente</h1>
</div>

{% if feedback %}
    {% if 'Erro' in feedback %}
        <div class="alerta alerta-erro">⚠ {{ feedback }}</div>
    {% else %}
        <div class="alerta alerta-sucesso">✔ {{ feedback }}</div>
    {% endif %}
{% endif %}

<div class="painel form-vertical">
    <form action="/atualizar_paciente" method="POST">

        <label>CPF do paciente</label>
        <input type="text" name="cpf" placeholder="Digite apenas os números" required>

        <div class="linha-campos">
            <div>
                <label>CEP</label>
                <input type="text" name="cep" placeholder="CEP">
            </div>
            <div>
                <label>Número</label>
                <input type="text" name="numero" placeholder="Número">
            </div>
        </div>

        <label>Logradouro</label>
        <input type="text" name="logradouro" placeholder="Rua, Avenida...">

        <label>Complemento</label>
        <input type="text" name="complemento" placeholder="Apartamento, bloco...">

        <div class="linha-campos">
            <div>
                <label>Bairro</label>
                <input type="text" name="bairro" placeholder="Bairro">
            </div>
            <div>
                <label>Cidade</label>
                <input type="text" name="cidade" placeholder="Cidade">
            </div>
            <div>
                <label>UF</label>
                <input type="text" name="uf" maxlength="2" placeholder="Ex: PB">
            </div>
        </div>

        <label>Número do Convênio</label>
        <input type="text" name="convenio" placeholder="Número do convênio">

        <button type="submit">Atualizar Paciente</button>

    </form>
</div>

{% endblock %}
